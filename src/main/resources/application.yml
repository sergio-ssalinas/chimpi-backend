# Los hosting (Render, etc.) indican el puerto con la variable PORT; local sigue en 8080.
# forward-headers: detras del proxy HTTPS de la plataforma, la app ve la IP/esquema reales.
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: lavabarber-api
  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:lavabarber;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  # En desarrollo el esquema lo crea Hibernate (create-drop) sobre H2: Flyway no corre.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt-secret: solo-para-desarrollo-no-usar-en-produccion
  jwt-expiration-horas: 720
  encryption-key: solo-para-desarrollo-no-usar-en-produccion
  # Origenes permitidos para CORS (front del backoffice). Coma-separado.
  cors-allowed-origins: http://localhost:3000,http://localhost:5173

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # Se define con las variables DB_URL, DB_USER y DB_PASSWORD (sin valores por defecto a proposito).
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  # En produccion el esquema lo crean las migraciones de src/main/resources/db/migration (Flyway)
  # y Hibernate solo VALIDA que las entidades coincidan con las tablas: si no coinciden, la app
  # no arranca (mejor eso que fallar en medio de una venta).
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  # OBLIGATORIO definir estas dos variables de entorno en produccion,
  # con valores largos y aleatorios (ej: openssl rand -base64 32).
  # Si se usan los valores por defecto en produccion, cualquiera podria
  # falsificar tokens o desencriptar las cedulas guardadas.
  jwt-secret: ${JWT_SECRET}
  jwt-expiration-horas: ${JWT_EXPIRATION_HORAS:720}
  encryption-key: ${APP_ENCRYPTION_KEY}
  # Dominio real del backoffice en produccion (ej: https://backoffice.chimpihub.com)
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
  # Primer arranque con la base vacia: se crea el negocio, los rubros base y el usuario ADMIN.
  # ADMIN_USERNAME y ADMIN_PASSWORD son obligatorios SOLO ese primer arranque (ver ProdBootstrap).
  bootstrap:
    negocio-nombre: ${NEGOCIO_NOMBRE:Chimpi Hub}
    admin-username: ${ADMIN_USERNAME:}
    admin-password: ${ADMIN_PASSWORD:}
